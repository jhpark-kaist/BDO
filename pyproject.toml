[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bdo"
version = "0.1.0"
description = "Pre-trained BDO encoders for fMRI ROI time series (inference only)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy"]

[tool.setuptools]
packages = ["bdo"]
